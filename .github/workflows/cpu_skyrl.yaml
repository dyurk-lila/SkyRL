name: SkyRL-CPU

on:
  push:
    branches: [ main ]
    paths:
      - 'ci/**'
      - 'skyrl/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/cpu_skyrl.yaml'
  pull_request:
    paths:
      - 'ci/**'
      - 'skyrl/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/cpu_skyrl.yaml'
  workflow_dispatch:

permissions:
  checks: write   # for status checks to appear
  contents: read

# Cancel runs for previous commits on the same branch
concurrency:
  group: skyrl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skyrl_tests:
    # ubuntu-latest (7 GB) OOM-kills the fp32 Qwen3.5-0.8B load in
    # tests/tx/models/test_qwen3_5.py (HF + tx copies). Use the org's 32 GB larger runner.
    runs-on: ubuntu-latest-8-core
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Run lint
      run: |
        uvx ruff check
    - name: Run pytest
      run: |
        uv run --extra tinker --extra jax --extra dev --with transformers==5.2.0 pytest --forked -s tests/tx/models/test_qwen3_5.py
        # tests/tinker/test_api.py and tests/tinker/test_sample_session_routing.py spin up a real
        # model-backed Tinker API server per test (subprocess.Popen + healthz polling); on CPU they
        # take ~35+ min and dominate this job (the session-routing file alone ran ~32 min upstream).
        # They are covered by the GPU/integration tinker CI (gpu_e2e_ci_tinker*), so exclude them here.
        uv run --extra tinker --extra jax --extra dev pytest --forked -s tests --ignore=tests/tx/gpu --ignore=tests/train --ignore=tests/backends/skyrl_train --ignore=tests/tx/models/test_qwen3_5.py --ignore=tests/tinker/test_api.py --ignore=tests/tinker/test_sample_session_routing.py
    - name: Run engine benchmarks
      run: |
        uv run --extra tinker --extra dev python skyrl/benchmarks/benchmark_engine.py --base-model trl-internal-testing/tiny-Qwen3ForCausalLM --backend-config '{"max_lora_adapters": 3, "max_lora_rank": 1}' --num-warmup-steps 1 --num-steps 1 --num-requests 1 --seq-len 8 --sample-max-tokens 16

