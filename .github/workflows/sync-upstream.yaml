# Opens a PR that brings the fork up to the latest `upstream/main`. It NEVER auto-merges:
# the conflict hotspots (config/trainer renames like #1738) demand human + CODEOWNERS review.
#
# Two-branch model (see upstream-sync/02-recurring-workflow.md):
#   * `main`    — zero-commit mirror of `upstream/main`; advances ONLY by `git merge --ff-only`.
#                 If `main` ever carries a non-upstream commit the fast-forward fails — by design.
#   * `develop` — long-lived integration branch carrying the bespoke delta. The reviewed sync PR
#                 merges the freshly-advanced `main` INTO `develop`.
#
# Flow each run:
#   1. Fast-forward `main` to `upstream/main` (push). Abort loudly if `main` has diverged.
#   2. Merge the new `main` into a `sync/develop-<date>` branch cut from `develop`.
#        - clean    -> open a normal PR into `develop`, request review
#        - conflicts -> commit the conflicted merge result (including conflict markers), push it,
#                       and open a DRAFT PR with a hotspot checklist for review
#
# ACTIVATION: scheduled + workflow_dispatch triggers only register from the repo's DEFAULT branch.
# This lives on `develop`; it stays dormant until an admin sets `develop` as the default branch.
# Before relying on it: confirm branch protection + CODEOWNERS on `develop`, and that the
# LILA_BOT GitHub App is allowed to push to `main` under its protection rule. The built-in
# GITHUB_TOKEN cannot push upstream commits that touch `.github/workflows/**`.

name: sync-upstream

on:
  schedule:
    - cron: "0 10 * * 1"   # Monday 10:00 UTC: 02:00 PST / 03:00 PDT.
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref to sync to (default: main)"
        required: false
        default: "main"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/NovaSky-AI/SkyRL.git
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'main' }}

jobs:
  open-sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.LILA_BOT_APP_ID }}
          private-key: ${{ secrets.LILA_BOT_NON_BASE64_PRIVATE_KEY }}
          owner: fl97inc
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git + rerere
        run: |
          git config user.name  "lila-sync-bot"
          git config user.email "lila-sync-bot@users.noreply.github.com"
          git config rerere.enabled true
          git config merge.conflictStyle zdiff3

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream --tags
          git fetch origin main
          echo "TARGET_SHA=$(git rev-parse "upstream/${UPSTREAM_REF}")" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short "upstream/${UPSTREAM_REF}")" >> "$GITHUB_ENV"
          echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Skip if develop already contains the target
        run: |
          if git merge-base --is-ancestor "$TARGET_SHA" origin/develop; then
            echo "develop already contains $TARGET_SHA — nothing to sync."
            echo "UP_TO_DATE=1" >> "$GITHUB_ENV"
          fi

      - name: Fast-forward main to upstream (refuse if main diverged)
        if: env.UP_TO_DATE != '1'
        run: |
          # main MUST be a zero-commit mirror. If it carries any non-upstream commit, the
          # fast-forward is impossible and that is a hard error to surface, not paper over.
          if ! git merge-base --is-ancestor origin/main "$TARGET_SHA"; then
            echo "::error::main ($(git rev-parse --short origin/main)) is NOT an ancestor of upstream/${UPSTREAM_REF} ($SHORT_SHA)."
            echo "::error::main has diverged from upstream — it must be a zero-commit mirror for --ff-only to work."
            echo "::error::Move the offending commit(s) onto a topic branch off develop, reset main to upstream, and re-run."
            exit 1
          fi
          git push origin "${TARGET_SHA}:refs/heads/main"
          echo "Fast-forwarded main -> $SHORT_SHA"

      - name: Create sync branch off develop and merge the new main
        if: env.UP_TO_DATE != '1'
        id: merge
        run: |
          BRANCH="sync/develop-${STAMP}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git switch -c "$BRANCH" origin/develop
          if git merge --no-edit "$TARGET_SHA"; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            # Commit the conflicted merge result so reviewers can inspect the
            # upstream changes and conflict markers directly in the draft PR.
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git add -A
            git commit -m "chore(sync): record upstream ${SHORT_SHA} conflicts"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi
          git push -u origin "$BRANCH" --force-with-lease

      - name: Open PR (clean)
        if: env.UP_TO_DATE != '1' && steps.merge.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          OWNER="${REPO%/*}"
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          Automated upstream sync. \`main\` fast-forwarded to \`${TARGET_SHA}\`; this PR merges it into \`develop\`.

          - [ ] CODEOWNERS review on hotspot files
          - [ ] CI green (incl. \`check_sft_trend.py\` gate)
          - [ ] \`uv sync\` for \`skyrl[megatron]\` verified
          - [ ] \`UPSTREAM.md\` updated (last-sync row + drop-list)
          - [ ] tag \`lila-sync-${SHORT_SHA}\` after merge

          Do NOT auto-merge — see upstream-sync/02-recurring-workflow.md.
          EOF
          PR_JSON=$(gh api \
            "repos/${REPO}/pulls?head=${OWNER}:${BRANCH}&base=develop&state=open" \
            --jq '.[0] // empty')
          if [ -z "$PR_JSON" ]; then
            PR_JSON=$(gh api -X POST "repos/${REPO}/pulls" \
              -f base=develop \
              -f head="$BRANCH" \
              -f title="chore(sync): upstream ${SHORT_SHA}" \
              -f body="$(cat "$BODY_FILE")")
          fi
          PR_NUMBER=$(echo "$PR_JSON" | jq -r .number)
          PR_URL=$(echo "$PR_JSON" | jq -r .html_url)
          echo "$PR_URL"
          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/labels" -f labels[]=upstream-sync || echo "::warning::Could not add upstream-sync label"

      - name: Open DRAFT PR with conflict checklist
        if: env.UP_TO_DATE != '1' && steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          OWNER="${REPO%/*}"
          CHECKLIST=$(sed 's/^/- [ ] /' /tmp/conflicts.txt 2>/dev/null || echo "- [ ] (see CI log)")
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          Automated upstream sync to \`${TARGET_SHA}\` hit conflicts merging the new \`main\` into \`develop\`. \`main\` was fast-forwarded, and this draft branch commits the conflicted merge result so the upstream updates and conflict markers are visible in the PR diff.

          Conflicting files:
          ${CHECKLIST}

          Resolution rules: see 'Mandatory hotspot resolution rules' in upstream-sync/01-catch-up-plan.md. Never auto-merge.
          EOF
          PR_JSON=$(gh api \
            "repos/${REPO}/pulls?head=${OWNER}:${BRANCH}&base=develop&state=open" \
            --jq '.[0] // empty')
          if [ -z "$PR_JSON" ]; then
            PR_JSON=$(gh api -X POST "repos/${REPO}/pulls" \
              -f base=develop \
              -f head="$BRANCH" \
              -f title="chore(sync): upstream ${SHORT_SHA} (CONFLICTS — manual resolve)" \
              -f body="$(cat "$BODY_FILE")" \
              -F draft=true)
          else
            PR_NUMBER=$(echo "$PR_JSON" | jq -r .number)
            PR_JSON=$(gh api -X PATCH "repos/${REPO}/pulls/${PR_NUMBER}" \
              -f title="chore(sync): upstream ${SHORT_SHA} (CONFLICTS — manual resolve)" \
              -f body="$(cat "$BODY_FILE")")
          fi
          PR_NUMBER=$(echo "$PR_JSON" | jq -r .number)
          PR_URL=$(echo "$PR_JSON" | jq -r .html_url)
          echo "$PR_URL"
          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/labels" -f labels[]=upstream-sync || echo "::warning::Could not add upstream-sync label"
